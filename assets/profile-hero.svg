<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CagedBird — playable systems, verified end to end</title>
  <desc id="desc">A midnight pixel-art banner with a Tux mosaic, gem accents, and a statement about building games, systems, and upstream fixes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#101d38"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#b8c7e8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="gemGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 286C196 238 318 340 518 286S876 216 1200 276V360H0Z" fill="#07101f" opacity="0.55"/>
  <ellipse cx="930" cy="166" rx="235" ry="150" fill="#2563eb" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="1085" cy="86" rx="90" ry="76" fill="#fb7185" opacity="0.08" filter="url(#soft)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="62" fill="#7dd3fc" font-size="17" font-weight="700" letter-spacing="3">CAGEDBIRD / BUILD LOG 043</text>
    <text x="64" y="138" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.2">PLAYABLE SYSTEMS.</text>
    <text x="66" y="181" fill="#b9c7e5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">Games with native cores. Tools with evidence.</text>
    <text x="66" y="214" fill="#b9c7e5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">Fixes that land upstream.</text>

    <g transform="translate(64 263)" font-size="13" font-weight="700" letter-spacing="1.1">
      <rect width="166" height="40" rx="8" fill="#102441" stroke="#2a4d72"/>
      <circle cx="20" cy="20" r="5" fill="#67e8f9" filter="url(#gemGlow)"/>
      <text x="35" y="25" fill="#dff8ff">C++20 → WASM</text>

      <g transform="translate(178 0)">
        <rect width="188" height="40" rx="8" fill="#102441" stroke="#2a4d72"/>
        <circle cx="20" cy="20" r="5" fill="#fbbf24" filter="url(#gemGlow)"/>
        <text x="35" y="25" fill="#fff2c2">EXACT REPLAY</text>
      </g>

      <g transform="translate(378 0)">
        <rect width="202" height="40" rx="8" fill="#102441" stroke="#2a4d72"/>
        <circle cx="20" cy="20" r="5" fill="#fb7185" filter="url(#gemGlow)"/>
        <text x="35" y="25" fill="#ffe1e8">MERGED UPSTREAM</text>
      </g>
    </g>
  </g>

  <rect x="721" y="34" width="423" height="292" rx="22" fill="#07101f" stroke="#2a436b" stroke-width="2"/>
  <rect x="736" y="49" width="393" height="262" rx="15" fill="#0b1427" stroke="#162d4e"/>
  <path d="M741 84H790M1075 84H1124M741 278H790M1075 278H1124" stroke="url(#line)" stroke-width="3"/>

  <!-- Pixel Tux mosaic: the profile signature, derived from Brilliant Sort's flagship board. -->
  <g transform="translate(824 61)" shape-rendering="crispEdges">
    <g fill="#18243b">
      <rect x="54" y="0" width="72" height="18"/><rect x="36" y="18" width="108" height="18"/>
      <rect x="18" y="36" width="144" height="18"/><rect x="0" y="54" width="180" height="90"/>
      <rect x="18" y="144" width="144" height="54"/><rect x="36" y="198" width="108" height="18"/>
    </g>
    <g fill="#e7eefb">
      <rect x="54" y="36" width="72" height="18"/><rect x="36" y="54" width="108" height="36"/>
      <rect x="54" y="90" width="72" height="18"/>
      <rect x="36" y="126" width="108" height="18"/><rect x="54" y="144" width="72" height="54"/>
    </g>
    <g fill="#67e8f9" filter="url(#gemGlow)">
      <rect x="54" y="54" width="18" height="18"/><rect x="108" y="54" width="18" height="18"/>
      <rect x="18" y="126" width="18" height="36"/><rect x="144" y="126" width="18" height="36"/>
    </g>
    <g fill="#f97316">
      <rect x="72" y="90" width="36" height="18"/>
      <rect x="36" y="216" width="54" height="18"/><rect x="108" y="216" width="54" height="18"/>
    </g>
    <g fill="#fb7185"><rect x="36" y="90" width="18" height="18"/><rect x="126" y="90" width="18" height="18"/></g>
    <g fill="#334b75"><rect x="36" y="108" width="108" height="18"/><rect x="18" y="162" width="36" height="18"/><rect x="126" y="162" width="36" height="18"/></g>
    <rect x="78" y="18" width="18" height="18" fill="#ffffff" opacity="0.9"/>
  </g>

  <g shape-rendering="crispEdges">
    <rect x="765" y="73" width="10" height="10" fill="#67e8f9"/><rect x="775" y="63" width="10" height="10" fill="#67e8f9" opacity="0.65"/>
    <rect x="1091" y="258" width="10" height="10" fill="#fbbf24"/><rect x="1101" y="268" width="10" height="10" fill="#fbbf24" opacity="0.65"/>
    <rect x="777" y="286" width="8" height="8" fill="#fb7185"/><rect x="1098" y="70" width="8" height="8" fill="#fb7185"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27.25" fill="none" stroke="#a7c7ff" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
